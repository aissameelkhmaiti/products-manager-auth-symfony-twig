security:
    # Password hashing
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # User provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Disable security for profiler / assets
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Main firewall
        main:
            lazy: true
            provider: app_user_provider

            # Authenticator
            custom_authenticator: App\Security\LoginFormAuthenticator

            # Logout
            logout:
                path: app_logout
                target: app_login

            # Remember me
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

    # Route protection
    access_control:
        # Public pages
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # Protected pages
        - { path: ^/dashboard, roles: ROLE_USER }

        # Protect all other routes if needed
        # - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10